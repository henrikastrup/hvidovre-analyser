<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#1A4D2E;--green-mid:#2E7D54;--green-lite:#4A9B7F;
  --gold:#C9973A;--gold-lite:#E8C06A;
  --bg:#0E1612;--bg-2:#131F18;--bg-3:#1A2B1F;
  --glass:rgba(255,255,255,0.04);--glass-brd:rgba(255,255,255,0.08);
  --glass-hov:rgba(255,255,255,0.07);
  --text:#F0EDE8;--text-mid:#B8B5AE;--text-muted:#6E7D74;
  --nav-h:48px;--side-w:252px;--r:10px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;}

/* TOP NAV */
.top-nav{height:var(--nav-h);min-height:var(--nav-h);background:var(--bg-2);border-bottom:1px solid var(--glass-brd);display:flex;align-items:center;padding:0 16px 0 0;z-index:200;flex-shrink:0;}
.hamburger{width:var(--nav-h);height:var(--nav-h);display:none;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text-muted);cursor:pointer;font-size:18px;flex-shrink:0;transition:color .15s;}
.hamburger:hover{color:var(--text);}
.nav-brand{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;color:var(--gold);padding:0 20px;border-right:1px solid var(--glass-brd);height:100%;display:flex;align-items:center;white-space:nowrap;width:var(--side-w);flex-shrink:0;}
.nav-current{font-size:13px;color:var(--text-muted);padding:0 20px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .2s;}
.nav-current.active{color:var(--text);}
.nav-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.nav-btn{padding:6px 13px;border:1px solid var(--glass-brd);background:transparent;border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted);cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.nav-btn.primary{border-color:var(--green-mid);color:var(--green-lite);}
.nav-btn.primary:hover{background:rgba(46,125,84,.15);}
#btnNewTab{display:none;}

/* LAYOUT */
.layout{display:flex;flex:1;min-height:0;overflow:hidden;}

/* SIDEBAR */
.sidebar{width:var(--side-w);min-width:var(--side-w);background:var(--bg-2);border-right:1px solid var(--glass-brd);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:100;}
.side-search{padding:12px;border-bottom:1px solid var(--glass-brd);flex-shrink:0;}
.side-search-wrap{position:relative;}
.side-search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;width:13px;height:13px;}
#sideSearch{width:100%;background:var(--glass);border:1px solid var(--glass-brd);border-radius:7px;padding:7px 10px 7px 32px;font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--text);outline:none;transition:border-color .2s;}
#sideSearch::placeholder{color:var(--text-muted);}
#sideSearch:focus{border-color:rgba(201,151,58,.4);}
.side-nav{flex:1;overflow-y:auto;padding:8px 0 16px;scrollbar-width:thin;scrollbar-color:var(--glass-brd) transparent;}
.side-nav::-webkit-scrollbar{width:4px;}
.side-nav::-webkit-scrollbar-thumb{background:var(--glass-brd);border-radius:2px;}
.side-home{display:flex;align-items:center;gap:9px;padding:8px 14px;margin:4px 8px;border-radius:7px;font-size:13px;font-weight:500;color:var(--text-mid);cursor:pointer;text-decoration:none;transition:all .15s;border:1px solid transparent;}
.side-home:hover{background:var(--glass);color:var(--text);}
.side-home.active{background:rgba(201,151,58,.1);color:var(--gold-lite);border-color:rgba(201,151,58,.2);}
.side-cat{padding:14px 16px 5px;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:7px;}
.side-cat::after{content:'';flex:1;height:1px;background:var(--glass-brd);}
.side-link{display:flex;align-items:flex-start;gap:9px;padding:7px 14px;margin:1px 8px;border-radius:7px;font-size:12.5px;color:var(--text-muted);cursor:pointer;text-decoration:none;transition:all .15s;border:1px solid transparent;line-height:1.35;}
.side-link:hover{background:var(--glass-hov);color:var(--text-mid);}
.side-link.active{background:rgba(26,77,46,.2);color:var(--text);border-color:rgba(46,125,84,.25);}
.side-link.active .side-dot{background:var(--green-mid);}
.side-dot{width:5px;height:5px;border-radius:50%;background:var(--text-muted);flex-shrink:0;margin-top:5px;transition:background .15s;}
.side-footer{border-top:1px solid var(--glass-brd);padding:12px 14px;flex-shrink:0;}
.side-footer a{display:flex;align-items:center;gap:7px;font-family:'DM Mono',monospace;font-size:10.5px;color:var(--text-muted);text-decoration:none;transition:color .15s;}
.side-footer a:hover{color:var(--gold-lite);}

/* INDHOLD */
.content-area{flex:1;position:relative;overflow:hidden;min-height:0;}
#analysisFrame{position:absolute;inset:0;border:none;display:none;width:100%;height:100%;background:#F9F6F0;}
#homeView{position:absolute;inset:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--glass-brd) transparent;}
#homeView::-webkit-scrollbar{width:6px;}
#homeView::-webkit-scrollbar-thumb{background:var(--glass-brd);border-radius:3px;}

/* HJEMVISNING HERO */
.home-hero{padding:44px 40px 32px;position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(26,77,46,.18) 0%,transparent 60%);border-bottom:1px solid var(--glass-brd);}
.home-hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(to bottom,transparent,rgba(0,0,0,.3) 30%,rgba(0,0,0,.3) 70%,transparent);pointer-events:none;}
.home-hero-inner{position:relative;z-index:1;}
.home-eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.home-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}
.home-hero h1{font-family:'DM Serif Display',serif;font-size:clamp(26px,3.5vw,44px);font-weight:400;line-height:1.1;margin-bottom:12px;}
.home-hero h1 em{font-style:italic;color:var(--gold-lite);}
.home-hero p{font-size:13.5px;color:var(--text-muted);font-weight:300;line-height:1.7;max-width:460px;}
.home-stats{display:flex;gap:28px;margin-top:24px;flex-wrap:wrap;}
.home-stat-val{font-family:'DM Serif Display',serif;font-size:24px;line-height:1;color:var(--text);margin-bottom:3px;}
.home-stat-lbl{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted);}
.home-stat-div{width:1px;background:var(--glass-brd);align-self:stretch;}

/* HJEMVISNING GRID */
.home-grid-wrap{padding:24px 40px 48px;}
.home-section{margin-bottom:32px;}
.home-section-hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--glass-brd);}
.home-cat-icon{font-size:15px;}
.home-cat-name{font-family:'DM Serif Display',serif;font-size:16px;font-weight:400;color:var(--text);}
.home-cat-count{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);background:var(--glass);border:1px solid var(--glass-brd);padding:2px 8px;border-radius:20px;margin-left:auto;}
.home-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
.hcard{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r);padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,border-color .2s,background .2s;position:relative;overflow:hidden;}
.hcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;opacity:0;transition:opacity .2s;}
.hcard.bef::before{background:linear-gradient(90deg,var(--green-mid),var(--green-lite));}
.hcard.mig::before{background:linear-gradient(90deg,var(--gold),var(--gold-lite));}
.hcard.sko::before{background:linear-gradient(90deg,#5DADE2,#85C1E9);}
.arb::before{background:linear-gradient(90deg,#E67E22,#F0A500);}
.hcard:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.5);border-color:rgba(255,255,255,.13);background:var(--glass-hov);}
.hcard:hover::before{opacity:1;}
.hcard-title{font-family:'DM Serif Display',serif;font-size:14.5px;font-weight:400;line-height:1.3;color:var(--text);}
.hcard-desc{font-size:12px;line-height:1.6;color:var(--text-muted);flex:1;}
.hcard-footer{display:flex;align-items:center;justify-content:space-between;padding-top:9px;border-top:1px solid rgba(255,255,255,.05);}
.hcard-date{font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted);}
.hcard-arrow{width:22px;height:22px;border-radius:50%;border:1px solid var(--glass-brd);display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all .2s;}
.hcard:hover .hcard-arrow{border-color:var(--gold);color:var(--gold);transform:rotate(-45deg);}

/* MOBIL OVERLAY */
.overlay{display:none;position:fixed;inset:var(--nav-h) 0 0 0;background:rgba(0,0,0,.6);z-index:99;backdrop-filter:blur(2px);}
.overlay.show{display:block;}

/* RESPONSIVE */
@media(max-width:768px){
  :root{--side-w:260px;}
  .hamburger{display:flex;}
  .nav-brand{width:auto;border-right:none;padding-left:0;}
  .sidebar{position:fixed;top:var(--nav-h);left:0;bottom:0;transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.5);}
  .home-hero{padding:28px 20px 20px;}
  .home-grid-wrap{padding:18px 20px 40px;}
  .home-cards{grid-template-columns:1fr;}
}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.06) transparent;}
</style>
</head>
<body>

</nav>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="side-search">
      <div class="side-search-wrap">
        <svg class="side-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="sideSearch" placeholder="Søg i analyser…" autocomplete="off">

      <a href="https://astrup.org" target="_blank">

        astrup.org

  <div class="content-area">

</div>

<div class="overlay" id="overlay"></div>

<script>
// ═══════════════════════════════════════════════════════
//  ANALYSESDATA — opdater dette array for nye analyser
// ═══════════════════════════════════════════════════════
const analysesData = [
  {titel:"Hvidovre Folkepuls",kategori:"Befolkning & Demografi",beskrivelse:"Live-monitor over befolkningsudviklingen i Hvidovre — månedlige opdateringer fra Danmarks Statistik fordelt på aldersgrupper og herkomst.",url:"/hvidovre-folkepuls.html",dato:"2025-05-01"},
  {titel:"Hvidovre Folketal Prognose 2026",kategori:"Befolkning & Demografi",beskrivelse:"Fremskrivning af Hvidovres befolkningstal frem mod 2026 baseret på historiske trender i fødsler, dødsfald og migration.",url:"/hvidovre-folketal-prognose-2026.html",dato:"2025-04-15"},
  {titel:"Indvandring til Hvidovre (Live)",kategori:"Indvandring & Migration",beskrivelse:"Direkte datahentning fra DST: ugentlige til- og fraflytninger til Hvidovre fordelt på nationalitet og oprindelse.",url:"/hvidovre-indvandring-live.html",dato:"2025-05-08"},
  {titel:"Indvandring til Hvidovre (Ugentlig)",kategori:"Indvandring & Migration",beskrivelse:"Ugentligt opdateret analyse af indvandringsstrømmene med AI-genereret sammenfatning og trendvisning.",url:"/hvidovre-indvandring-ugentlig.html",dato:"2025-05-08"},
  {titel:"Nepal Indvandring til Hvidovre (Live)",kategori:"Indvandring & Migration",beskrivelse:"Fokuseret deep-dive på den nepalesiske indvandring: aldersfordeling, kønsopdeling og historisk tidsserieanalyse.",url:"/hvidovre-nepal-indvandring-live.html",dato:"2025-04-20"},
  {titel:"Hvidovre: Afgangsprøver Dansk & Matematik 2018–2025",kategori:"Skole & Uddannelse",beskrivelse:"Syv års karakterudvikling på tværs af alle Hvidovre-skoler. Skift mellem dansk og matematik, sorteret efter skolestørrelse.",url:"/hvidovre-afgangsprover-dansk-matematik-2018-2025.html",dato:"2025-05-10"},
  {titel:"Greve: Afgangsprøver Dansk & Matematik 2018–2025",kategori:"Skole & Uddannelse",beskrivelse:"Karakterudviklingen på tværs af 14 institutioner i Greve Kommune sorteret efter skolestørrelse — 7 skoleår.",url:"/greve-afgangsprover-dansk-matematik-2018-2025.html",dato:"2025-05-10"},
      {titel:"Hvidovre Ydelsespuls",kategori:"Arbejdsmarked",beskrivelse:"Månedligt overblik over 12 ydelsestyper i fuldtidspersoner. Vælg ydelsestyper for at se grafen og AI-genererede analyser pr. ydelsestype. Opdateres automatisk via n8n og Gemini.",url:"/hvidovre-ydelsespuls.html",dato:"2026-05-11"},
  {titel:"Ydelsesoverblik — Hvidovre 2025–2026",kategori:"Arbejdsmarked",beskrivelse:"12 ydelsestyper opgjort i fuldtidspersoner (helårspersoner) for de seneste 12 måneder. Del 1 viser Hvidovres absolutte udvikling med AI-analyse. Del 2 sammenligner indekseret med landsplan.",url:"/ydelsesoverblk-hvidovre-2025-2026.html",dato:"2026-05-11"},
  {titel:"Sygedagpenge jan. 2025 – feb. 2026",kategori:"Arbejdsmarked",beskrivelse:"Månedlig udvikling i sygedagpengemodtagere i Hvidovre sammenlignet med Brøndby, Rødovre, Ballerup, Gladsaxe og Herlev. Vis som indeks eller faktiske tal — diagram eller tabel.",url:"/sygedagpenge-2025-2026.html",dato:"2026-05-11"},
];

const KAT = {
  "Befolkning & Demografi":  {cls:"bef",emoji:"🌱",kort:"Befolkning"},
  "Indvandring & Migration": {cls:"mig",emoji:"🗺", kort:"Indvandring"},
  "Skole & Uddannelse":      {cls:"sko",emoji:"📐",kort:"Uddannelse"},
  "Arbejdsmarked":           {cls:"arb",emoji:"📊",kort:"Arbejdsmarked"},
};

let aktivUrl = null;
let sogeQ = '';

function getParam(){return new URLSearchParams(location.search).get('a');}
function setParam(url){const sp=new URLSearchParams(location.search);url?sp.set('a',url.replace(/^\//,'')):sp.delete('a');history.pushState({},'',sp.toString()?'?'+sp.toString():location.pathname);}
function fmtDato(iso){return new Date(iso+'T00:00:00').toLocaleDateString('da-DK',{day:'numeric',month:'short',year:'numeric'});}

function bygSidebar(q=''){
  const nav=document.getElementById('sideNav');
  nav.innerHTML='';
  const ql=q.toLowerCase().trim();

  // Hjem
  const h=document.createElement('a');
  h.className='side-home'+(aktivUrl?'':' active');
  h.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>Oversigt';
  h.onclick=()=>{visHjem();lukMobil();};
  nav.appendChild(h);

  [...new Set(analysesData.map(a=>a.kategori))].forEach(kat=>{
    const list=analysesData.filter(a=>a.kategori===kat&&(!ql||a.titel.toLowerCase().includes(ql)||a.beskrivelse.toLowerCase().includes(ql)));
    if(!list.length)return;
    const cfg=KAT[kat]||{emoji:'📊',kort:kat};
    const c=document.createElement('div');
    c.className='side-cat';
    c.textContent=cfg.emoji+' '+(cfg.kort||kat);
    nav.appendChild(c);
    list.forEach(a=>{
      const l=document.createElement('a');
      l.className='side-link'+(aktivUrl===a.url?' active':'');
      l.innerHTML='<span class="side-dot"></span>'+a.titel;
      l.onclick=()=>{visAnalyse(a);lukMobil();};
      nav.appendChild(l);
    });
  });
}

function bygHjem(){
  const kats=[...new Set(analysesData.map(a=>a.kategori))];
  const senest=fmtDato(analysesData.map(a=>a.dato).sort().reverse()[0]);
  let h=`<div class="home-hero"><div class="home-hero-inner">
    <div class="home-eyebrow">analyse.astrup.org</div>
    <h1>Data &amp; <em>Analyser</em></h1>
    <p>Interaktive analyser og dashboards baseret på officielle datakilder. Vælg en analyse i menuen til venstre eller klik på et kort herunder.</p>
    <div class="home-stats">
      <div><div class="home-stat-val">${analysesData.length}</div><div class="home-stat-lbl">Analyser</div></div>
      <div class="home-stat-div"></div>
      <div><div class="home-stat-val">${kats.length}</div><div class="home-stat-lbl">Kategorier</div></div>
      <div class="home-stat-div"></div>
      <div><div class="home-stat-val">${senest}</div><div class="home-stat-lbl">Seneste opdatering</div></div>
    </div>
  </div></div><div class="home-grid-wrap">`;

  kats.forEach(kat=>{
    const cfg=KAT[kat]||{emoji:'📊',cls:'bef'};
    const list=analysesData.filter(a=>a.kategori===kat);
    h+=`<div class="home-section"><div class="home-section-hdr">
      <span class="home-cat-icon">${cfg.emoji}</span>
      <span class="home-cat-name">${kat}</span>
      <span class="home-cat-count">${list.length}</span>
    </div><div class="home-cards">`;
    list.forEach(a=>{
      h+=`<div class="hcard ${cfg.cls}" data-url="${a.url}">
        <div class="hcard-title">${a.titel}</div>
        <div class="hcard-desc">${a.beskrivelse}</div>
        <div class="hcard-footer">
          <div class="hcard-date">${fmtDato(a.dato)}</div>
          <div class="hcard-arrow"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
        </div>
      </div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div>`;
  document.getElementById('homeView').innerHTML=h;

  // Event delegation til kort-klik
  document.getElementById('homeView').addEventListener('click',e=>{
    const card=e.target.closest('.hcard');
    if(!card)return;
    const a=analysesData.find(x=>x.url===card.dataset.url);
    if(a)visAnalyse(a);
  });
}

function visAnalyse(a){
  aktivUrl=a.url;
  setParam(a.url);
  const frame=document.getElementById('analysisFrame');
  const home=document.getElementById('homeView');
  frame.src=a.url;
  frame.style.display='block';
  home.style.display='none';
  const nc=document.getElementById('navCurrent');
  nc.textContent=a.titel;
  nc.classList.add('active');
  document.getElementById('btnNewTab').style.display='flex';
  bygSidebar(sogeQ);
  document.title=a.titel+' · analyse.astrup.org';
}

function visHjem(){
  aktivUrl=null;
  setParam(null);
  const frame=document.getElementById('analysisFrame');
  frame.style.display='none';
  frame.src='about:blank';
  document.getElementById('homeView').style.display='block';
  const nc=document.getElementById('navCurrent');
  nc.textContent='Oversigt';
  nc.classList.remove('active');
  document.getElementById('btnNewTab').style.display='none';
  bygSidebar(sogeQ);
  document.title='Analyseportal · analyse.astrup.org';
}

function aabneNytFaneblad(){if(aktivUrl)window.open(aktivUrl,'_blank');}

function lukMobil(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('hamburger').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click',lukMobil);

let sogeTimer;
document.getElementById('sideSearch').addEventListener('input',e=>{
  clearTimeout(sogeTimer);
  sogeTimer=setTimeout(()=>{sogeQ=e.target.value;bygSidebar(sogeQ);},160);
});

window.addEventListener('popstate',()=>{
  const p=getParam();
  if(p){const a=analysesData.find(x=>x.url.replace(/^\//,'')=== p);if(a){visAnalyse(a);return;}}
  visHjem();
});

// INIT
bygHjem();
bygSidebar();
const init=getParam();
if(init){const a=analysesData.find(x=>x.url.replace(/^\//,'')===init);if(a)visAnalyse(a);}
</script>
</body>
</html>
