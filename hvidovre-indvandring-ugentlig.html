<html lang="da">
<head>

if(n){n.style.setProperty('display','none','important');
n.style.setProperty('height','0','important');
n.style.setProperty('overflow','hidden','important');}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hvidovre Indvandringspuls — Ugentlig Monitor</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap');
:root {
  --green:#1A4D2E; --green-mid:#2E7D54; --gold:#C9973A; --red:#C0392B;
  --bg:#F9F6F0; --card:#FFFFFF; --text:#1C1C1A; --mid:#4A4A44;
  --muted:#8A8A7E; --border:#E2DDD4; --shadow:0 2px 20px rgba(26,77,46,0.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}
.hdr{background:var(--green);color:#fff;padding:32px 48px 26px;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;right:-60px;bottom:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none;}
.hdr::after{content:'';position:absolute;right:140px;top:-80px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.02);pointer-events:none;}
.hdr-eye{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px;}
.hdr h1{font-family:'DM Serif Display',serif;font-size:clamp(20px,2.5vw,30px);font-weight:400;line-height:1.2;margin-bottom:8px;}
.hdr h1 em{font-style:italic;color:#E8C06A;}
.hdr p{font-size:13px;color:rgba(255,255,255,.6);font-weight:300;line-height:1.65;max-width:640px;}
.toolbar{background:#fff;border-bottom:1px solid var(--border);padding:10px 48px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sep{width:1px;height:22px;background:var(--border);margin:0 2px;}
.btn{padding:7px 15px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--mid);cursor:pointer;border-radius:6px;transition:all .15s;white-space:nowrap;}
.btn:hover{border-color:var(--green);color:var(--green);}
.btn.active{background:var(--green);border-color:var(--green);color:#fff;}
.btn.active:hover{background:#143d24;}
.btn.sam-on{background:var(--gold);border-color:var(--gold);color:#fff;}
.btn.sam-on:hover{background:#a37a2e;border-color:#a37a2e;}
#updateTime{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:auto;white-space:nowrap;}
.statusbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 48px;display:flex;align-items:center;gap:9px;min-height:34px;}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot.loading{background:var(--gold);animation:pulse .9s ease-in-out infinite;}
.dot.ok{background:var(--green-mid);}
.dot.error{background:var(--red);}
#statusMsg{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
main{padding:26px 48px 40px;max-width:1140px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:11px;margin-bottom:24px;}
.kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:14px 17px;box-shadow:var(--shadow);}
.kpi.gld{border-left-color:var(--gold);}
.kpi.mid{border-left-color:var(--green-mid);}
.kpi-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.kpi-val{font-family:'DM Serif Display',serif;font-size:30px;line-height:1;color:var(--text);margin-bottom:3px;}
.kpi-delta{font-family:'DM Mono',monospace;font-size:11.5px;margin-bottom:2px;}
.kpi-delta.pos{color:var(--green-mid);}
.kpi-delta.neg{color:var(--red);}
.kpi-delta.neu{color:var(--muted);}
.kpi-desc{font-size:11.5px;color:var(--mid);line-height:1.4;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;position:relative;}
.chart-header{margin-bottom:20px;}
.chart-title{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:4px;}
.chart-desc{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.periode-note{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);background:rgba(201,151,58,.08);border:1px solid rgba(201,151,58,.25);border-radius:5px;padding:5px 11px;display:inline-block;margin-top:9px;}
.canvas-wrap{position:relative;height:420px;}
.data-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.data-tbl th{font-family:'DM Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 14px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;}
.data-tbl td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text);}
.data-tbl tr:last-child td{border-bottom:none;}
.data-tbl tr:hover td{background:rgba(26,77,46,.025);}
.data-tbl td.num{font-family:'DM Mono',monospace;font-weight:500;font-size:14px;}
.data-tbl td.rank{color:var(--muted);font-family:'DM Mono',monospace;width:38px;}
.data-tbl td.land{font-weight:500;}
.data-tbl td.pos{color:var(--green-mid);font-family:'DM Mono',monospace;}
.data-tbl td.neg{color:var(--red);font-family:'DM Mono',monospace;}
.data-tbl td.neu{color:var(--muted);font-family:'DM Mono',monospace;}
.ov{position:absolute;inset:0;background:rgba(249,246,240,.85);border-radius:12px;display:none;align-items:center;justify-content:center;z-index:10;}
.ov.show{display:flex;}
.spinner{width:32px;height:32px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--green);animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:var(--shadow);margin-bottom:24px;}
.ai-header{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;}
.ai-icon{width:36px;height:36px;background:var(--green);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ai-title{font-weight:600;font-size:14px;color:var(--text);margin-bottom:2px;}
.ai-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
.ai-badge{margin-left:auto;font-family:'DM Mono',monospace;font-size:10px;padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.ai-badge.ny{background:rgba(46,125,84,.12);color:var(--green-mid);}
.ai-badge.gammel{background:rgba(201,151,58,.12);color:var(--gold);}
.ai-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.ai-tab{padding:5px 14px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--mid);cursor:pointer;border-radius:20px;transition:all .15s;}
.ai-tab:hover{border-color:var(--green);color:var(--green);}
.ai-tab.active{background:var(--green);border-color:var(--green);color:#fff;}
.ai-heading{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;color:var(--text);margin-bottom:12px;line-height:1.35;}
.ai-text{font-size:14px;line-height:1.8;color:var(--mid);max-width:760px;}
.ai-empty{font-size:13px;color:var(--muted);font-style:italic;}
.kilde{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);padding:16px 48px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.dl-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;background:transparent;border:1.5px solid var(--border);border-radius:6px;font-family:'DM Mono',monospace;font-size:11px;color:var(--mid);cursor:pointer;transition:all .15s;}
.dl-btn:hover{border-color:var(--green);color:var(--green);}
@media(max-width:700px){
  .hdr,.toolbar,.statusbar,main,.kilde{padding-left:20px;padding-right:20px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
  .canvas-wrap{height:320px;}
}
</style>
</head>
<body>
<style>
.ap-navbar{all:unset;display:flex!important;align-items:center;gap:0;background:#0E1612;border-bottom:1px solid rgba(255,255,255,0.08);padding:0 28px;height:40px;font-family:'DM Mono',monospace,sans-serif;position:relative;z-index:9999;box-sizing:border-box;width:100%;}
.ap-back{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.55);font-size:11.5px;letter-spacing:0.04em;text-decoration:none;transition:color 0.18s;cursor:pointer;}
.ap-back:hover{color:#E8C06A;}
.ap-back svg{flex-shrink:0;transition:transform 0.18s;}
.ap-back:hover svg{transform:translateX(-3px);}
.ap-brand{font-size:11.5px;letter-spacing:0.08em;color:#E8C06A;margin-left:4px;}
.ap-sep{width:1px;height:18px;background:rgba(255,255,255,0.1);margin:0 16px;}
.ap-domain{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.25);}
.ap-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(201,151,58,0.6);margin-right:8px;vertical-align:middle;}
</style>
<div class="ap-navbar">
  <a class="ap-back" href="https://analyse.astrup.org">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <span class="ap-brand">analyse.astrup.org</span>
  </a>
  <div class="ap-sep"></div>
</body>
</html>
