<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randomizer</title>
<meta name="description" content="Træk et antal tilfældige tal inden for et interval.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1A4D2E;--green-mid:#2E7D54;--green-lite:#4A9B7F;
  --gold:#C9973A;--gold-lite:#E8C06A;
  --bg:#0E1612;--bg-2:#131F18;--bg-3:#1A2B1F;
  --glass:rgba(255,255,255,0.04);--glass-brd:rgba(255,255,255,0.08);--glass-hov:rgba(255,255,255,0.07);
  --text:#F0EDE8;--text-mid:#B8B5AE;--text-muted:#6E7D74;--err:#E8907A;
  --r:10px;
}
html{background:var(--bg)}
body{min-height:100vh;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}

/* HERO */
.hero{padding:44px 16px 32px;position:relative;overflow:hidden;background:linear-gradient(160deg,rgba(26,77,46,.18) 0%,transparent 60%);border-bottom:1px solid var(--glass-brd)}
.hero::after{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:linear-gradient(to bottom,transparent,rgba(0,0,0,.3) 30%,rgba(0,0,0,.3) 70%,transparent);mask-image:linear-gradient(to bottom,transparent,rgba(0,0,0,.3) 30%,rgba(0,0,0,.3) 70%,transparent);pointer-events:none}
.hero-inner{position:relative;z-index:1;max-width:680px;margin:0 auto}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:20px;height:1px;background:var(--gold)}
h1{font-family:'DM Serif Display',serif;font-size:clamp(30px,5vw,44px);font-weight:400;line-height:1.1;margin-bottom:12px}
h1 em{font-style:italic;color:var(--gold-lite)}
.lead{font-size:13.5px;color:var(--text-muted);font-weight:300;line-height:1.7;max-width:460px}

main{max-width:680px;margin:0 auto;padding:28px 16px 48px}
.card{background:var(--glass);border:1px solid var(--glass-brd);border-radius:var(--r);padding:20px 22px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-lite))}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:480px){.row{grid-template-columns:1fr 1fr}.row .antal{grid-column:1/-1}}
label{display:block;font-family:'DM Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px}
input[type=number]{width:100%;font-family:'DM Mono',monospace;font-size:18px;padding:10px 12px;border:1px solid var(--glass-brd);border-radius:7px;background:var(--glass);color:var(--text);outline:none;transition:border-color .2s}
input[type=number]:focus{border-color:rgba(201,151,58,.55)}
.opts{display:flex;flex-wrap:wrap;gap:8px 22px;margin:18px 0}
.opts label{display:flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--text-mid);margin:0;cursor:pointer}
.opts input{width:16px;height:16px;accent-color:var(--green-mid)}
button{font-family:'DM Mono',monospace;cursor:pointer;transition:all .15s}
#go{width:100%;padding:13px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:rgba(46,125,84,.18);color:var(--text);border:1px solid var(--green-mid);border-radius:7px}
#go:hover{background:rgba(46,125,84,.32);border-color:var(--green-lite)}
.err{color:var(--err);font-size:13px;min-height:1.4em;margin-top:10px}
#result{margin-top:18px;padding-top:18px;border-top:1px solid var(--glass-brd)}
.res-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.res-head h2{font-family:'DM Serif Display',serif;font-size:17px;font-weight:400;color:var(--text)}
#copy{padding:6px 13px;font-size:11px;background:transparent;color:var(--text-muted);border:1px solid var(--glass-brd);border-radius:6px;white-space:nowrap}
#copy:hover{border-color:var(--gold);color:var(--gold)}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;list-style:none}
.nums li{background:var(--bg-2);border:1px solid var(--glass-brd);border-radius:8px;text-align:center;padding:9px 4px 11px;font-family:'DM Serif Display',serif;font-size:22px;line-height:1.1;color:var(--gold-lite);font-variant-numeric:tabular-nums}
.nums li span{display:block;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:3px}
.hidden{display:none}
footer{color:var(--text-muted);font-family:'DM Mono',monospace;font-size:10.5px;margin-top:24px;text-align:center;line-height:1.7}
footer a{color:var(--text-muted);text-decoration:none;border-bottom:1px solid var(--glass-brd)}
footer a:hover{color:var(--gold-lite)}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">Analyseværktøjer</div>
    <h1>Random<em>izer</em></h1>
    <p class="lead">Træk et antal tilfældige hele tal inden for et interval — fx 10 tal mellem 0 og 1.400.</p>
  </div>
</header>
<main>
  <form class="card" id="form" novalidate>
    <div class="row">
      <div><label for="fra">Fra</label><input type="number" id="fra" value="0" step="1" required></div>
      <div><label for="til">Til</label><input type="number" id="til" value="1400" step="1" required></div>
      <div class="antal"><label for="antal">Antal tal</label><input type="number" id="antal" value="10" min="1" max="10000" step="1" required></div>
    </div>
    <div class="opts">
      <label><input type="checkbox" id="unik" checked> Ingen gentagelser</label>
      <label><input type="checkbox" id="sorter"> Sortér stigende</label>
    </div>
    <button type="submit" id="go">Generér tal</button>
    <div class="err" id="err" role="alert"></div>

    <section id="result" class="hidden" aria-live="polite">
      <div class="res-head">
        <h2 id="resTitle"></h2>
        <button type="button" id="copy">Kopiér</button>
      </div>
      <ol class="nums" id="nums"></ol>
    </section>
  </form>

  <footer>Tallene trækkes med browserens kryptografiske tilfældighedsgenerator<br><a href="/">analyse.astrup.org</a></footer>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var MAX_ANTAL = 10000;
  var last = [];

  // Tilfældigt helt tal i [0, n) — uden skævhed, via crypto + forkastelse
  function randBelow(n) {
    if (n <= 4294967296) {
      var limit = 4294967296 - (4294967296 % n);
      var buf = new Uint32Array(1), x;
      do { crypto.getRandomValues(buf); x = buf[0]; } while (x >= limit);
      return x % n;
    }
    // Meget store intervaller: 53 bits tilfældighed
    var b = new Uint32Array(2);
    crypto.getRandomValues(b);
    var r = (b[0] * 2097152 + (b[1] >>> 11)) / 9007199254740992;
    return Math.floor(r * n);
  }

  function draw(fra, til, antal, unik) {
    var n = til - fra + 1;
    var out = [];
    if (!unik) {
      for (var i = 0; i < antal; i++) out.push(fra + randBelow(n));
      return out;
    }
    if (antal > n / 2 && n <= 1e6) {
      // Delvis Fisher–Yates når vi skal bruge en stor del af intervallet
      var pool = new Array(n);
      for (var j = 0; j < n; j++) pool[j] = fra + j;
      for (var k = 0; k < antal; k++) {
        var m = k + randBelow(n - k);
        var t = pool[k]; pool[k] = pool[m]; pool[m] = t;
      }
      return pool.slice(0, antal);
    }
    var seen = new Set();
    while (out.length < antal) {
      var v = fra + randBelow(n);
      if (!seen.has(v)) { seen.add(v); out.push(v); }
    }
    return out;
  }

  var fmt = new Intl.NumberFormat('da-DK');

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var err = $('err'); err.textContent = '';
    var fra = Number($('fra').value), til = Number($('til').value), antal = Number($('antal').value);
    var unik = $('unik').checked;

    if ($('fra').value === '' || $('til').value === '' || $('antal').value === '') return fail('Udfyld alle tre felter.');
    if (!Number.isInteger(fra) || !Number.isInteger(til) || !Number.isInteger(antal)) return fail('Brug kun hele tal.');
    if (!Number.isSafeInteger(fra) || !Number.isSafeInteger(til)) return fail('Tallene er for store.');
    if (til < fra) { var s = fra; fra = til; til = s; $('fra').value = fra; $('til').value = til; }
    if (antal < 1) return fail('Antal skal være mindst 1.');
    if (antal > MAX_ANTAL) return fail('Højst ' + fmt.format(MAX_ANTAL) + ' tal ad gangen.');
    var n = til - fra + 1;
    if (unik && antal > n) return fail('Intervallet ' + fmt.format(fra) + '–' + fmt.format(til) + ' har kun ' + fmt.format(n) + ' forskellige tal. Sænk antallet eller slå "Ingen gentagelser" fra.');

    last = draw(fra, til, antal, unik);
    if ($('sorter').checked) last.sort(function (a, b) { return a - b; });

    var ol = $('nums'); ol.innerHTML = '';
    var frag = document.createDocumentFragment();
    last.forEach(function (v, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span>' + (i + 1) + '</span>';
      li.appendChild(document.createTextNode(String(v)));
      frag.appendChild(li);
    });
    ol.appendChild(frag);
    $('resTitle').textContent = fmt.format(antal) + ' tilfældige tal mellem ' + fmt.format(fra) + ' og ' + fmt.format(til);
    $('copy').textContent = 'Kopiér';
    $('result').classList.remove('hidden');
  });

  function fail(msg) {
    $('err').textContent = msg;
    $('result').classList.add('hidden');
  }

  $('copy').addEventListener('click', function () {
    var txt = last.join('\n');
    var done = function () { $('copy').textContent = 'Kopieret ✓'; };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else fallback();
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
      ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove();
    }
  });
})();
</script>
</body>
</html>
