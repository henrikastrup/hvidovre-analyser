<!DOCTYPE html>
<html lang="da">
<head>

(function(){if(window.self===window.top)return;
var n=document.querySelector('.ap-navbar');
if(n){n.style.setProperty('display','none','important');
n.style.setProperty('height','0','important');
n.style.setProperty('overflow','hidden','important');}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afgangskarakterer Dansk &amp; Matematik · Greve Kommune 2018–2025</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --green:#1A4D2E; --green-mid:#2E7D54; --gold:#C9973A;
  --red:#C0392B; --bg:#F9F6F0; --card:#FFFFFF;
  --text:#1C1C1A; --mid:#4A4A44; --muted:#8A8A7E;
  --border:#E2DDD4; --shadow:0 2px 20px rgba(26,77,46,0.07);
  --dansk:#5DADE2; --mat:#1A4D2E;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);}

/* HEADER */
.hdr{background:var(--green);color:#fff;padding:32px 48px 26px;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;right:-60px;bottom:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none;}
.hdr-eye{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:10px;}
.hdr h1{font-family:'DM Serif Display',serif;font-size:clamp(20px,2.5vw,30px);font-weight:400;line-height:1.2;margin-bottom:8px;}
.hdr h1 em{font-style:italic;color:#E8C06A;}
.hdr p{font-size:13px;color:rgba(255,255,255,.6);font-weight:300;line-height:1.65;max-width:700px;}

/* FAG-TOGGLE (fremtrædende) */
.fag-bar{background:#fff;border-bottom:2px solid var(--border);padding:14px 48px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.fag-lbl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.fag-btn{padding:9px 22px;border:2px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;color:var(--mid);cursor:pointer;border-radius:8px;transition:all .2s;}
.fag-btn:hover{border-color:var(--green);color:var(--green);}
.fag-btn.mat.active{background:var(--mat);border-color:var(--mat);color:#fff;}
.fag-btn.dansk.active{background:var(--dansk);border-color:var(--dansk);color:#fff;}
.fag-indicator{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;}
.fag-btn.mat .fag-indicator{background:var(--mat);}
.fag-btn.dansk .fag-indicator{background:var(--dansk);}
.fag-btn.mat.active .fag-indicator,.fag-btn.dansk.active .fag-indicator{background:rgba(255,255,255,.8);}
.dl-btn{margin-left:auto;padding:8px 16px;border:1.5px solid var(--border);background:transparent;font-family:'DM Mono',monospace;font-size:11px;color:var(--mid);cursor:pointer;border-radius:6px;transition:all .15s;}
.dl-btn:hover{border-color:var(--green);color:var(--green);}

/* TOOLBAR (sekundær) */
.toolbar{background:#fafafa;border-bottom:1px solid var(--border);padding:8px 48px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{padding:6px 13px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--mid);cursor:pointer;border-radius:6px;transition:all .15s;white-space:nowrap;}
.btn:hover{border-color:var(--green);color:var(--green);}
.btn.active{background:var(--green);border-color:var(--green);color:#fff;}
.sep{width:1px;height:20px;background:var(--border);margin:0 2px;}
.toolbar-lbl{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}

main{padding:26px 48px 40px;max-width:1160px;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:11px;margin-bottom:28px;}
.kpi{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:10px;padding:14px 17px;box-shadow:var(--shadow);}
.kpi.gld{border-left-color:var(--gold);}
.kpi.mid-c{border-left-color:var(--green-mid);}
.kpi.red{border-left-color:var(--red);}
.kpi.blue{border-left-color:var(--dansk);}
.kpi-lbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;}
.kpi-val{font-family:'DM Serif Display',serif;font-size:28px;line-height:1;color:var(--text);margin-bottom:3px;}
.kpi-delta{font-family:'DM Mono',monospace;font-size:11px;margin-bottom:2px;}
.kpi-delta.pos{color:var(--green-mid);}
.kpi-delta.neg{color:var(--red);}
.kpi-delta.neu{color:var(--muted);}
.kpi-desc{font-size:11.5px;color:var(--mid);line-height:1.4;}

/* SECTION LABEL */
.section-label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;margin-top:4px;display:flex;align-items:center;gap:8px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}

/* CHART CARD */
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;box-shadow:var(--shadow);margin-bottom:28px;}
.chart-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.chart-title{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;color:var(--text);margin-bottom:4px;}
.chart-desc{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
.chart-btns{display:flex;gap:6px;flex-shrink:0;}
.cbtn{padding:5px 12px;border:1.5px solid var(--border);background:transparent;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--mid);cursor:pointer;border-radius:6px;transition:all .15s;}
.cbtn:hover{border-color:var(--green);color:var(--green);}
.cbtn.active{background:var(--green);border-color:var(--green);color:#fff;}

/* CANVAS */
.canvas-wrap{position:relative;}
#cvBar{display:block;}
#cvLine{display:none;}

/* TABLE */
.tbl-wrap{overflow-x:auto;display:none;}
.data-tbl{width:100%;border-collapse:collapse;font-size:13px;}
.data-tbl th{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;}
.data-tbl th.num{text-align:right;}
.data-tbl td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
.data-tbl tr:last-child td{border-bottom:none;}
.data-tbl tr:hover td{background:rgba(26,77,46,.025);}
.data-tbl td.num{font-family:'DM Mono',monospace;font-size:13px;text-align:right;}
.data-tbl td.skole{font-weight:500;}
.data-tbl td.pos{color:var(--green-mid);}
.data-tbl td.neg{color:var(--red);}
.data-tbl td.tag{display:inline-block;}
.type-badge{font-size:9.5px;font-family:'DM Mono',monospace;color:var(--muted);background:rgba(0,0,0,.05);padding:1px 6px;border-radius:4px;margin-left:5px;vertical-align:middle;}
.str-badge{font-size:10px;font-family:'DM Mono',monospace;color:var(--muted);}
.bar-mini{display:inline-block;height:6px;background:var(--border);border-radius:3px;vertical-align:middle;margin-left:4px;}

/* ANALYSE */
.analyse-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px 32px;box-shadow:var(--shadow);margin-bottom:28px;}
.analyse-title{font-family:'DM Serif Display',serif;font-size:22px;font-weight:400;color:var(--text);margin-bottom:6px;}
.analyse-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:24px;}
.analyse-body h3{font-family:'DM Serif Display',serif;font-size:16px;font-weight:400;color:var(--green);margin:20px 0 8px;}
.analyse-body h3:first-child{margin-top:0;}
.analyse-body p{font-size:14px;line-height:1.85;color:var(--mid);margin-bottom:12px;}
.analyse-body ul{padding-left:18px;margin-bottom:12px;}
.analyse-body li{font-size:14px;line-height:1.8;color:var(--mid);margin-bottom:4px;}
.analyse-body strong{color:var(--text);}
.hl-grøn{color:var(--green-mid);font-weight:600;}
.hl-rød{color:var(--red);font-weight:600;}
.hl-guld{color:#8B6914;font-weight:600;}

.kilde{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);padding:16px 48px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}

@media(max-width:700px){
  .hdr,.fag-bar,.toolbar,main,.kilde{padding-left:20px;padding-right:20px;}
  .kpi-row{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<style>
.ap-navbar{all:unset;display:flex!important;align-items:center;gap:0;background:#0E1612;border-bottom:1px solid rgba(255,255,255,0.08);padding:0 28px;height:40px;font-family:'DM Mono',monospace,sans-serif;position:relative;z-index:9999;box-sizing:border-box;width:100%;}
.ap-back{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.55);font-size:11.5px;letter-spacing:0.04em;text-decoration:none;transition:color 0.18s;cursor:pointer;}
.ap-back:hover{color:#E8C06A;}
.ap-back svg{flex-shrink:0;transition:transform 0.18s;}
.ap-back:hover svg{transform:translateX(-3px);}
.ap-brand{font-size:11.5px;letter-spacing:0.08em;color:#E8C06A;margin-left:4px;}
.ap-sep{width:1px;height:18px;background:rgba(255,255,255,0.1);margin:0 16px;}
.ap-domain{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.25);}
.ap-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(201,151,58,0.6);margin-right:8px;vertical-align:middle;}
</style>

  <div class="ap-sep"></div>
</body>
