<!DOCTYPE html>
<html lang="da">
<head>
<script>
(function(){if(window.self===window.top)return;
var n=document.querySelector('.ap-navbar');
if(n){n.style.setProperty('display','none','important');
n.style.setProperty('height','0','important');
n.style.setProperty('overflow','hidden','important');}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indvandring til Hvidovre — efter statsborgerskab</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap');

  :root {
    --green:     #1A4D2E;
    --green-mid: #2E7D54;
    --gold:      #C9973A;
    --red:       #C0392B;
    --bg:    #F9F6F0;
    --card:  #FFFFFF;
    --text:  #1C1C1A;
    --mid:   #4A4A44;
    --muted: #8A8A7E;
    --border:#E2DDD4;
    --shadow:0 2px 20px rgba(26,77,46,0.07);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

  /* LOCAL FILE BANNER */
  .local-banner {
    display:none; background:#FEF3C7; border-bottom:1px solid #F59E0B;
    padding:10px 48px; font-size:13px; color:#92400E;
    align-items:center; gap:10px;
  }
  .local-banner.show { display:flex; }
  .local-banner strong { color:#78350F; }
  .local-banner a { color:#78350F; font-weight:600; }

  /* HEADER */
  .hdr {
    background:var(--green); color:#fff;
    padding:32px 48px 26px; position:relative; overflow:hidden;
  }
  .hdr::before {
    content:''; position:absolute; right:-80px; bottom:-80px;
    width:300px; height:300px; border-radius:50%;
    background:rgba(255,255,255,.03); pointer-events:none;
  }
  .hdr-eye { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:10px; }
  .hdr h1  { font-family:'DM Serif Display',serif; font-size:clamp(20px,2.5vw,31px); font-weight:400; line-height:1.2; margin-bottom:8px; }
  .hdr h1 em { font-style:italic; color:#E8C06A; }
  .hdr p { font-size:13px; color:rgba(255,255,255,.6); font-weight:300; line-height:1.6; max-width:580px; }

  /* TOOLBAR */
  .toolbar {
    background:#fff; border-bottom:1px solid var(--border);
    padding:10px 48px; display:flex; align-items:center;
    gap:10px; flex-wrap:wrap;
  }
  .select-wrap { position:relative; flex-shrink:0; }
  .select-wrap::after {
    content:'▾'; position:absolute; right:12px; top:50%;
    transform:translateY(-50%); font-size:12px; color:var(--muted); pointer-events:none;
  }
  #countrySelect {
    appearance:none; -webkit-appearance:none;
    padding:8px 36px 8px 14px;
    border:1.5px solid var(--green); border-radius:7px;
    font-family:'DM Sans',sans-serif; font-size:14px; font-weight:500; color:var(--green);
    background:#fff; cursor:pointer; min-width:200px; max-width:290px;
    transition:box-shadow .15s;
  }
  #countrySelect:focus { outline:none; box-shadow:0 0 0 3px rgba(26,77,46,.15); }

  .divider { width:1px; height:28px; background:var(--border); flex-shrink:0; }
  .btn {
    padding:7px 15px; border:1.5px solid var(--border); background:transparent;
    font-family:'DM Sans',sans-serif; font-size:13px; color:var(--mid); cursor:pointer;
    border-radius:6px; transition:all .15s; white-space:nowrap; flex-shrink:0;
  }
  .btn:hover { border-color:var(--green); color:var(--green); }
  .btn.grn { background:var(--green); border-color:var(--green); color:#fff; }
  .btn.grn:hover { background:#143d24; }
  .btn.gld { background:var(--gold); border-color:var(--gold); color:#fff; }
  .btn.gld:hover { background:var(--green); border-color:var(--green); }
  #updateTime { font-family:'DM Mono',monospace; font-size:10.5px; color:var(--muted); margin-left:auto; }

  /* STATUS */
  .statusbar {
    background:#fff; border-bottom:1px solid var(--border);
    padding:8px 48px; display:flex; align-items:center; gap:9px; min-height:34px;
  }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.loading { background:var(--gold); animation:pulse .9s ease-in-out infinite; }
  .dot.ok      { background:var(--green-mid); }
  .dot.error   { background:var(--red); }
  #statusMsg   { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* MAIN */
  main { padding:28px 48px; max-width:1100px; }

  /* KPI */
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:26px; }
  .kpi {
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--green);
    border-radius:10px; padding:14px 17px; box-shadow:var(--shadow); transition:opacity .3s;
  }
  .kpi.gld { border-left-color:var(--gold); }
  .kpi.red { border-left-color:var(--red); }
  .kpi.mid { border-left-color:var(--green-mid); }
  .kpi.dim { opacity:.35; }
  .kpi-lbl  { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .kpi-val  { font-family:'DM Serif Display',serif; font-size:33px; line-height:1; color:var(--text); margin-bottom:3px; }
  .kpi-desc { font-size:11.5px; color:var(--mid); line-height:1.4; }

  /* CHART CARD */
  .chart-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:22px 26px 18px; box-shadow:var(--shadow); }
  .card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:4px; flex-wrap:wrap; }
  .card-titles h2 { font-family:'DM Serif Display',serif; font-size:17px; font-weight:400; margin-bottom:3px; }
  .card-titles p  { font-size:12.5px; color:var(--muted); line-height:1.5; max-width:520px; }

  .view-toggle { display:flex; border:1.5px solid var(--border); border-radius:7px; overflow:hidden; flex-shrink:0; }
  .vtab {
    padding:6px 15px; border:none; background:transparent;
    font-family:'DM Sans',sans-serif; font-size:12.5px; color:var(--mid);
    cursor:pointer; transition:all .15s; white-space:nowrap; border-right:1px solid var(--border);
  }
  .vtab:last-child { border-right:none; }
  .vtab:hover  { background:#F0F0EA; color:var(--green); }
  .vtab.active { background:var(--green); color:#fff; }

  .legend { display:flex; gap:16px; margin:12px 0 8px; flex-wrap:wrap; }
  .leg {
    display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--mid);
    cursor:pointer; user-select:none; padding:3px 8px 3px 4px;
    border-radius:5px; transition:opacity .15s, background .15s;
  }
  .leg:hover { background:#F0F0EA; }
  .leg.skjult { opacity:.35; }
  .leg-ln { width:26px; height:3px; border-radius:2px; flex-shrink:0; }
  .leg-sq { width:11px; height:11px; border-radius:3px; flex-shrink:0; }

  .chart-wrap { position:relative; height:370px; }

  .ov {
    display:none; position:absolute; inset:0; background:rgba(255,255,255,.88);
    border-radius:10px; align-items:center; justify-content:center;
    flex-direction:column; gap:11px; z-index:10;
    font-family:'DM Mono',monospace; font-size:12px; color:var(--muted);
  }
  .ov.show { display:flex; }
  .spin { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .empty-state { display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column; gap:10px; text-align:center; padding:24px; }
  .empty-state.show { display:flex; }
  .empty-icon { font-size:36px; opacity:.4; }
  .empty-msg  { font-size:14px; color:var(--muted); line-height:1.6; }

  .note { background:#FDF9F0; border:1px solid #EDD9A0; border-radius:8px; padding:10px 14px; font-size:12px; color:#7A6020; line-height:1.55; margin-top:12px; }
  .note strong { color:#5A4010; }

  /* DATA TABLE */
  #dataTable thead tr { background:var(--green); color:#fff; }
  #dataTable thead th { padding:10px 14px; text-align:left; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; }
  #dataTable tbody tr:nth-child(even) { background:#F6F3ED; }
  #dataTable tbody tr:hover { background:#EBF4EF; }
  #dataTable tbody td { padding:9px 14px; border-bottom:1px solid var(--border); color:var(--mid); font-size:13px; }
  #dataTable tbody td:first-child { font-family:'DM Mono',monospace; font-size:12px; color:var(--text); font-weight:500; }
  #dataTable .pos { color:var(--green); font-weight:700; }
  #dataTable .neg { color:var(--red);   font-weight:700; }
  #dataTable .hi  { color:var(--green); font-weight:700; }

  .source { margin-top:24px; padding:11px 14px; background:#fff; border:1px solid var(--border); border-radius:8px; font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); line-height:1.7; }
  .source strong { color:var(--mid); }

  @media (max-width:700px) {
    .hdr, main, .toolbar, .statusbar, .local-banner { padding-left:16px; padding-right:16px; }
    .chart-wrap { height:270px; }
    .card-top { flex-direction:column; }
  }
</style>
</head>
<body>
<style>
.ap-navbar{all:unset;display:flex!important;align-items:center;gap:0;background:#0E1612;border-bottom:1px solid rgba(255,255,255,0.08);padding:0 28px;height:40px;font-family:'DM Mono',monospace,sans-serif;position:relative;z-index:9999;box-sizing:border-box;width:100%;}
.ap-back{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.55);font-size:11.5px;letter-spacing:0.04em;text-decoration:none;transition:color 0.18s;cursor:pointer;}
.ap-back:hover{color:#E8C06A;}
.ap-back svg{flex-shrink:0;transition:transform 0.18s;}
.ap-back:hover svg{transform:translateX(-3px);}
.ap-brand{font-size:11.5px;letter-spacing:0.08em;color:#E8C06A;margin-left:4px;}
.ap-sep{width:1px;height:18px;background:rgba(255,255,255,0.1);margin:0 16px;}
.ap-domain{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.25);}
.ap-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(201,151,58,0.6);margin-right:8px;vertical-align:middle;}
</style>
<div class="ap-navbar">
  <a class="ap-back" href="https://analyse.astrup.org">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    <span class="ap-brand">analyse.astrup.org</span>
  </a>
  <div class="ap-sep"></div>
</body>
</html>
