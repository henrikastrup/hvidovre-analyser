<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hvidovre Folkepuls — Befolkningsmonitor 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap');

  :root {
    --green:     #1A4D2E;
    --green-mid: #2E7D54;
    --gold:      #C9973A;
    --red:       #C0392B;
    --bg:    #F9F6F0;
    --card:  #FFFFFF;
    --text:  #1C1C1A;
    --mid:   #4A4A44;
    --muted: #8A8A7E;
    --border:#E2DDD4;
    --shadow:0 2px 20px rgba(26,77,46,0.07);
    --g0:  #5DADE2; /* 0-2 */
    --g1:  #48C9B0; /* 3-5 */
    --g2:  #2E7D54; /* 6-17 */
    --g3:  #1A4D2E; /* 18-24 */
    --g4:  #C9973A; /* 25-66 */
    --g5:  #C0392B; /* 67-79 */
    --g6:  #8E44AD; /* 80+ */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

  /* HEADER */
  .hdr {
    background:var(--green); color:#fff;
    padding:32px 48px 26px; position:relative; overflow:hidden;
  }
  .hdr::before {
    content:''; position:absolute; right:-60px; bottom:-60px;
    width:280px; height:280px; border-radius:50%;
    background:rgba(255,255,255,.03); pointer-events:none;
  }
  .hdr-eye { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:10px; }
  .hdr h1  { font-family:'DM Serif Display',serif; font-size:clamp(20px,2.5vw,30px); font-weight:400; line-height:1.2; margin-bottom:8px; }
  .hdr h1 em { font-style:italic; color:#E8C06A; }
  .hdr p   { font-size:13px; color:rgba(255,255,255,.6); font-weight:300; line-height:1.65; max-width:600px; }

  /* TOOLBAR */
  .toolbar {
    background:#fff; border-bottom:1px solid var(--border);
    padding:10px 48px; display:flex; align-items:center;
    gap:10px; flex-wrap:wrap;
  }
  .btn {
    padding:7px 15px; border:1.5px solid var(--border); background:transparent;
    font-family:'DM Sans',sans-serif; font-size:13px; color:var(--mid);
    cursor:pointer; border-radius:6px; transition:all .15s; white-space:nowrap;
  }
  .btn:hover  { border-color:var(--green); color:var(--green); }
  .btn.grn    { background:var(--green); border-color:var(--green); color:#fff; }
  .btn.grn:hover { background:#143d24; }
  .btn.gld    { background:var(--gold); border-color:var(--gold); color:#fff; }
  .btn.gld:hover { background:var(--green); border-color:var(--green); }
  #updateTime { font-family:'DM Mono',monospace; font-size:10.5px; color:var(--muted); margin-left:auto; }

  /* STATUS */
  .statusbar {
    background:#fff; border-bottom:1px solid var(--border);
    padding:8px 48px; display:flex; align-items:center; gap:9px; min-height:34px;
  }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.loading { background:var(--gold); animation:pulse .9s ease-in-out infinite; }
  .dot.ok      { background:var(--green-mid); }
  .dot.error   { background:var(--red); }
  #statusMsg   { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* MAIN */
  main { padding:26px 48px; max-width:1140px; }

  /* KPI */
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:24px; }
  .kpi {
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--green);
    border-radius:10px; padding:14px 17px; box-shadow:var(--shadow); transition:opacity .3s;
  }
  .kpi.gld { border-left-color:var(--gold); }
  .kpi.red { border-left-color:var(--red);  }
  .kpi.mid { border-left-color:var(--green-mid); }
  .kpi.dim { opacity:.35; }
  .kpi-lbl  { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .kpi-val  { font-family:'DM Serif Display',serif; font-size:30px; line-height:1; color:var(--text); margin-bottom:3px; }
  .kpi-desc { font-size:11.5px; color:var(--mid); line-height:1.4; }

  /* AGE GROUP TABS */
  .tab-scroll { overflow-x:auto; margin-bottom:16px; padding-bottom:2px; }
  .tab-row { display:flex; gap:5px; min-width:max-content; }
  .atab {
    padding:7px 14px; border:1.5px solid var(--border); background:#fff;
    font-family:'DM Sans',sans-serif; font-size:12.5px; color:var(--mid);
    cursor:pointer; border-radius:7px; transition:all .15s; white-space:nowrap;
    font-weight:400;
  }
  .atab:hover { border-color:var(--green); color:var(--green); }
  .atab.active { color:#fff; border-color:transparent; font-weight:500; }
  .atab.alle-tab { font-weight:600; }

  /* CHART CARD */
  .chart-card { display:none; } /* ikke længere i brug */

  /* DISPLAY TOGGLE */
  .display-toggle { display:flex; border:1.5px solid var(--border); border-radius:7px; overflow:hidden; flex-shrink:0; }
  .dtab {
    padding:6px 14px; border:none; background:transparent;
    font-family:'DM Sans',sans-serif; font-size:12px; color:var(--mid);
    cursor:pointer; transition:all .15s; white-space:nowrap; border-right:1px solid var(--border);
  }
  .dtab:last-child { border-right:none; }
  .dtab:hover  { background:#F0F0EA; color:var(--green); }
  .dtab.active { background:var(--green); color:#fff; }

  /* LEGEND */
  .legend { display:flex; gap:14px; margin:10px 0 8px; flex-wrap:wrap; }
  .leg {
    display:flex; align-items:center; gap:7px; font-size:12px; color:var(--mid);
    cursor:pointer; user-select:none; padding:3px 8px 3px 4px;
    border-radius:5px; transition:opacity .15s, background .15s;
  }
  .leg:hover { background:#F0F0EA; }
  .leg.skjult { opacity:.3; }
  .leg-ln { width:24px; height:3px; border-radius:2px; flex-shrink:0; }

  /* CHART */
  .chart-wrap { position:relative; height:360px; }
  .ov {
    display:none; position:absolute; inset:0; background:rgba(255,255,255,.88);
    border-radius:10px; align-items:center; justify-content:center;
    flex-direction:column; gap:11px; z-index:10;
    font-family:'DM Mono',monospace; font-size:12px; color:var(--muted);
  }
  .ov.show { display:flex; }
  .spin { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* TABLE */
  .tbl-wrap { display:none; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead tr { background:var(--green); color:#fff; }
  thead th { padding:10px 14px; text-align:left; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; }
  tbody tr:nth-child(even) { background:#F6F3ED; }
  tbody tr:hover { background:#EBF4EF; }
  tbody td { padding:9px 14px; border-bottom:1px solid var(--border); color:var(--mid); }
  tbody td:first-child { font-family:'DM Mono',monospace; font-size:12px; color:var(--text); font-weight:500; }
  .pos { color:var(--green-mid) !important; font-weight:700; }
  .neg { color:var(--red) !important; font-weight:700; }
  .hi  { font-weight:700; color:var(--text) !important; }

  /* NOTE + SOURCE */
  .note { background:#FDF9F0; border:1px solid #EDD9A0; border-radius:8px; padding:10px 14px; font-size:12px; color:#7A6020; line-height:1.55; margin-top:12px; }
  .note strong { color:#5A4010; }
  .source { margin-top:22px; padding:11px 14px; background:#fff; border:1px solid var(--border); border-radius:8px; font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); line-height:1.7; }
  .source strong { color:var(--mid); }

  /* ── MAIN CARD (samlet analyse + graf) ── */
  .main-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow);
    overflow:hidden; margin-bottom:16px;
  }

  /* ── AI ANALYSE SEKTION ── */
  .ai-section {
    padding:28px 32px 24px;
    background:linear-gradient(160deg, #F2F8F5 0%, #FDFBF7 60%, #FFFFFF 100%);
  }
  .ai-section-top {
    display:flex; align-items:flex-start;
    justify-content:space-between; gap:20px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .ai-section-left { flex:1; min-width:0; }

  .ai-eyebrow {
    display:flex; align-items:center; gap:7px;
    font-family:'DM Mono',monospace; font-size:10.5px;
    letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  .ai-spark {
    width:20px; height:20px; border-radius:5px;
    background:linear-gradient(135deg, var(--gold), #E8C06A);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; flex-shrink:0;
  }
  .ai-badge {
    font-family:'DM Mono',monospace; font-size:10px;
    padding:2px 8px; border-radius:20px; display:none;
  }
  .ai-badge.ny     { display:inline-block; background:#EDF7F0; color:var(--green); border:1px solid #B8DFC8; }
  .ai-badge.gammel { display:inline-block; background:#FEF9EE; color:var(--gold);  border:1px solid #F0D9A0; }

  .ai-heading {
    font-family:'DM Serif Display',serif;
    font-size:clamp(18px,2.2vw,24px); font-weight:400;
    color:var(--text); margin-bottom:5px; line-height:1.2;
  }
  .ai-period { font-size:11.5px; color:var(--muted); font-family:'DM Mono',monospace; }



  .ai-body { font-size:14px; color:var(--mid); line-height:1.85; font-weight:300; }
  .ai-text { white-space:pre-wrap; }
  .ai-empty { color:var(--muted); font-size:13px; font-style:italic; }
  .ai-loading { display:flex; align-items:center; gap:9px; color:var(--muted); font-family:'DM Mono',monospace; font-size:12px; }

  /* ── SKILLELINJE ── */
  .card-divider { height:1px; background:var(--border); }

  /* ── GRAF SEKTION ── */
  .chart-section { padding:18px 32px 24px; }
  .chart-section-top {
    display:flex; align-items:center;
    justify-content:space-between; gap:14px;
    margin-bottom:0; flex-wrap:wrap;
  }
  .chart-sec-label {
    font-family:'DM Mono',monospace; font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    margin-bottom:2px;
  }
  .chart-sec-desc { font-size:12px; color:var(--muted); line-height:1.5; }

  @media (max-width:700px) {
    .hdr, main, .toolbar, .statusbar { padding-left:16px; padding-right:16px; }
    .chart-wrap { height:260px; }
    .ai-section { padding:20px 18px 18px; }
    .chart-section { padding:16px 18px 20px; }
    .ai-section-top { flex-direction:column; }
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eye">Henrik Astrup · analyse.astrup.org · Befolkningsanalyse</div>

<script>
/* ╔══════════════════════════════════════════════════════════════╗
   ║  HVIDOVRE FOLKEPULS — KONFIGURATION                         ║
   ║  Her justerer du dashboardet for nyt år eller nye prognosetal║
   ║  Du behøver ikke røre resten af koden.                      ║
   ╚══════════════════════════════════════════════════════════════╝ */
const CONFIG = {

  // ── KOMMUNEINDSTILLINGER ─────────────────────────────────────
  kommuneKode: '167',           // DST kommunekode for Hvidovre
  kommuneNavn: 'Hvidovre',      // Vises i overskrifter

  // ── ANALYSEÅR ────────────────────────────────────────────────
  // Skift dette til 2027, 2028 osv. for at opdatere dashboardet
  visAar: 2026,

  // ── PROGNOSEDATA ─────────────────────────────────────────────
  // Prognosetallene for 1. januar i visAar og 1. januar året efter.
  // Hentes fra kommunens 5-årige befolkningsprognose.
  // Ret tallene når ny prognose foreligger.
  prognose: {
    alle:   { start: 54243, slut: 54740 },  // Samlet folketal
    g0_2:   { start:  1627, slut:  1630 },  // 0–2 år
    g3_5:   { start:  1924, slut:  1921 },  // 3–5 år
    g6_17:  { start:  8265, slut:  8300 },  // 6–17 år
    g18_24: { start:  4528, slut:  4611 },  // 18–24 år
    g25_66: { start: 29183, slut: 29485 },  // 25–66 år
    g67_79: { start:  5886, slut:  5831 },  // 67–79 år
    g80p:   { start:  2830, slut:  2962 },  // 80+ år
  },

  // ── ALDERSGRÆNSER ────────────────────────────────────────────
  // Ændres kun hvis kommunen omlægger sine aldersgrupper i prognosen
  aldersgrupper: [
    { id:'alle',   label:'Alle aldersgrupper', min:0,  max:125, farve:'#1A4D2E' },
    { id:'g0_2',   label:'0–2 år',             min:0,  max:2,   farve:'#5DADE2' },
    { id:'g3_5',   label:'3–5 år',             min:3,  max:5,   farve:'#48C9B0' },
    { id:'g6_17',  label:'6–17 år',            min:6,  max:17,  farve:'#2E7D54' },
    { id:'g18_24', label:'18–24 år',           min:18, max:24,  farve:'#C9973A' },
    { id:'g25_66', label:'25–66 år',           min:25, max:66,  farve:'#C0392B' },
    { id:'g67_79', label:'67–79 år',           min:67, max:79,  farve:'#8E44AD' },
    { id:'g80p',   label:'80+ år',             min:80, max:125, farve:'#2980B9' },
  ],

  // ── DST-INDSTILLINGER ────────────────────────────────────────
  dstTabel: 'FOLK1AM',          // DST-tabel med månedlig befolkning
  analyseJsonUrl: 'https://raw.githubusercontent.com/henrikastrup/hvidovre-analyser/main/folketal-analyse.json',

};
/* ══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════
   PROGNOSEDATA — Hvidovre 5-årig prognose 2026
═══════════════════════════════════════════════════ */
// ALLE_GRUPPER bygges fra CONFIG — skift aldersgrupper og prognose i CONFIG-blokken øverst
const ALLE_GRUPPER = CONFIG.aldersgrupper.map(g => ({
  id:    g.id,
  label: g.label,
  aldre: g.id === 'alle' ? null : range(g.min, g.max + 1),
  prog26: CONFIG.prognose[g.id]?.start ?? 0,
  prog27: CONFIG.prognose[g.id]?.slut  ?? 0,
  farve:  g.farve
}));

function range(a, b) { const o=[]; for(let i=a;i<b;i++) o.push(i); return o; }

/* ═══════════════════════════════════════════════════
   INLINE DATALABELS PLUGIN — tegnes direkte på canvas
   Aktiveres pr. datasæt via _labelOpts: {color, ...}
═══════════════════════════════════════════════════ */
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

const inlineLabelPlugin = {
  id: 'inlineLabels',
  afterDatasetsDraw(chart) {
    const ctx = chart.ctx;
    const {left, right, top} = chart.chartArea;
    const font = '500 10px "DM Mono", monospace';

    chart.data.datasets.forEach((ds, i) => {
      if (!ds._labelOpts) return;
      const meta = chart.getDatasetMeta(i);
      if (meta.hidden) return;
      const {color} = ds._labelOpts;

      ctx.save();
      ctx.font = font;

      meta.data.forEach((pt, j) => {
        const val = ds.data[j];
        if (val == null || isNaN(val)) return;

        const text = Math.round(val).toLocaleString('da-DK');
        const tw   = ctx.measureText(text).width;
        const pw = tw + 10, ph = 17, r = 3;

        // Clamp x so pill stays inside chart area
        const cx = Math.max(left + pw / 2, Math.min(right - pw / 2, pt.x));
        const cy = Math.max(top + ph / 2 + 2, pt.y - pt.options.radius - 7 - ph / 2);

        // Pill background
        ctx.fillStyle = 'rgba(255,255,255,0.93)';
        rrect(ctx, cx - pw / 2, cy - ph / 2, pw, ph, r);
        ctx.fill();

        // Pill border
        ctx.strokeStyle = color;
        ctx.lineWidth = 0.9;
        ctx.stroke();

        // Text
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, cx, cy);
      });

      ctx.restore();
    });
  }
};

async function loadData() {

async function dstFetch(alderVals) {
  const r = await fetch(API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      table:'FOLK1AM', format:'JSONSTAT', lang:'da',
      variables:[
        {code:'OMRÅDE', values:[OMRD]},
        {code:'KØN',    values:['TOT']},
        {code:'ALDER',  values:alderVals},
        {code:'Tid',    values:['*']}
      ]
    })
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

/* ═══════════════════════════════════════════════════
   JSONSTAT PARSING OG MERGE
═══════════════════════════════════════════════════ */
function parseOne(ds) {
  const dimOrder = ds['dimension']['id'];
  const dimSizes = ds['dimension']['size'];
  const nAlder   = dimSizes[dimOrder.indexOf('ALDER')];
  const nTid     = dimSizes[dimOrder.indexOf('Tid')];

  const alderCat = ds['dimension']['ALDER']['category'];
  const aldere   = new Array(nAlder);
  for (const [k,v] of Object.entries(alderCat['index'])) aldere[v] = k;

  const tidCat = ds['dimension']['Tid']['category'];
  const tids   = new Array(nTid);
  for (const [k,v] of Object.entries(tidCat['index'])) tids[v] = k;

  return {tids, aldere, vals: ds['value'], nAlder, nTid};
}

function mergeJsonstat(ds1, ds2) {
  const p1 = parseOne(ds1);
  const p2 = parseOne(ds2);

  // Byg fælles Tid-liste (kun 2025+), sorteret
  const allTids = [...new Set([...p1.tids, ...p2.tids])]
    .filter(t => t >= '2026M01')
    .sort();

  // Byg fælles alder-liste
  const allAldere = [...new Set([...p1.aldere, ...p2.aldere])];

  // Byg opslag: alderStr → { tidStr → value }
  const lookup = {};

  function fillLookup(p) {
    p.aldere.forEach((a, ai) => {
      if (!lookup[a]) lookup[a] = {};
      p.tids.forEach((t, ti) => {
        lookup[a][t] = p.vals[ai * p.nTid + ti] ?? null;
      });
    });
  }
  fillLookup(p1);
  fillLookup(p2);

  return { tids: allTids, lookup };
}

function getGruppeVal(fd, gruppe, tidStr) {
  if (!fd?.lookup) return null;
  if (gruppe.aldre === null) return fd.lookup['IALT']?.[tidStr] ?? null;
  let sum = 0;
  for (const a of gruppe.aldre) {
    const v = fd.lookup[String(a)]?.[tidStr];
    if (v == null) return null;
    sum += v;
  }
  return sum;
}

/* ═══════════════════════════════════════════════════
   PROGNOSE BEREGNING
═══════════════════════════════════════════════════ */
function prognoseSerie(g) {
  // Returnerer array med 24 værdier (null for 2025, prognose for 2026)
  const diff    = g.prog27 - g.prog26;
  const monthly = diff / 12;
  return ALL_LABELS.map(tid => {
    if (!tid.startsWith('2026')) return null;
    const mIdx = parseInt(tid.slice(5)) - 1; // 0=jan, 11=dec
    return Math.round((g.prog26 + mIdx * monthly) * 10) / 10;
  });
}

function progForTid(g, tid) {
  if (!tid.startsWith('2026')) return null;
  const mIdx = parseInt(tid.slice(5)) - 1;
  return g.prog26 + mIdx * (g.prog27 - g.prog26) / 12;
}

/* ═══════════════════════════════════════════════════
   KPI OPDATERING
═══════════════════════════════════════════════════ */
function kpiDim(on) {
  document.querySelectorAll('.kpi').forEach(el => el.classList.toggle('dim', on));
}

function opdaterKPI() {
  const fd = folkeData;
  const g  = ALLE_GRUPPER.find(x => x.id === aktivGruppe) || ALLE_GRUPPER[0];

  // Find seneste tilgængelige 2026-måned med data
  let senesteTid = null, senesteVal = null;
  for (const tid of [...fd.tids].reverse()) {
    const v = getGruppeVal(fd, g, tid);
    if (v !== null && v > 0) { senesteTid = tid; senesteVal = v; break; }
  }
  if (!senesteTid) { senesteTid = fd.tids[fd.tids.length-1]; senesteVal = getGruppeVal(fd, g, senesteTid); }

  const prog     = senesteTid ? Math.round(progForTid(g, senesteTid) ?? 0) : null;
  const afv      = (senesteVal && prog) ? senesteVal - prog : null;
  const jan26    = getGruppeVal(fd, g, '2026M01');
  const aendring = (senesteVal && jan26) ? senesteVal - jan26 : null;
  const progDec  = Math.round(g.prog26 + 11 * (g.prog27 - g.prog26) / 12);

  const fmt = n => n !== null ? Math.round(n).toLocaleString('da-DK') : '—';
  const fmtSign = n => n !== null ? (n >= 0 ? '+' : '') + Math.round(n).toLocaleString('da-DK') : '—';

  document.getElementById('k1').textContent  = fmt(senesteVal);
  document.getElementById('k1d').textContent = senesteTid ? fmtLabel(senesteTid) : '—';
  document.getElementById('k2').textContent  = prog ? fmt(prog) : '—';
  document.getElementById('k2d').textContent = senesteTid ? `Prognose ${fmtLabel(senesteTid)}` : '—';
  document.getElementById('k3').textContent  = fmtSign(afv);
  document.getElementById('k3d').textContent = afv !== null ? (afv >= 0 ? 'Over prognose' : 'Under prognose') : '—';
  document.getElementById('k4').textContent  = fmtSign(aendring);
  document.getElementById('k4d').textContent = 'Siden jan 2026';
  document.getElementById('k5').textContent  = fmt(progDec);
  document.getElementById('k5d').textContent = `${g.label} · dec 2026`;

  // Farv afvigelse-kort
  const k3el = document.getElementById('k3').parentElement;
  k3el.className = 'kpi ' + (afv === null ? '' : afv >= 0 ? 'mid' : 'red');
}

    analyseData = await r.json();
    visAnalyse();
  } catch(e) {
    document.getElementById('aiMeta').textContent  = 'Ingen analyse tilgængelig endnu';
    document.getElementById('aiBody').innerHTML    = '<div class="ai-empty">AI-analysen genereres den 10. i hver måned via n8n og vises her automatisk, når den er klar.</div>';
  }
}

function visAnalyse() {
  if (!analyseData) return;

  const genereret = analyseData.genereret || '—';
  const periode   = analyseData.senesteMåned || analyseData.senestePeriode || '—';
  document.getElementById('aiMeta').textContent = `Baseret på ${periode} · Genereret ${genereret}`;

  // Overskrift
  const g = ALLE_GRUPPER.find(x => x.id === aktivAiTab) || ALLE_GRUPPER[0];
  opdaterOverskrift(g.id);

  // Badge
  const badge = document.getElementById('aiBadge');
  if (analyseData.genereret) {
    const dage = Math.floor((Date.now() - new Date(analyseData.genereret)) / 864e5);
    badge.textContent = dage <= 35 ? 'Opdateret' : `${dage} dage siden`;
    badge.className   = 'ai-badge ' + (dage <= 35 ? 'ny' : 'gammel');
  }

  // Tekstcontainer
  const body = document.getElementById('aiBody');
  body.innerHTML = '<div class="ai-text" id="aiTekst"></div>';
  visAnalyseTekst();
}

function visAnalyseTekst() {
  if (!analyseData) return;
  const tekst = analyseData.analyse?.[aktivAiTab]
             || analyseData.analyse?.alle
             || 'Ingen analyse for denne gruppe.';
  document.getElementById('aiTekst').textContent = tekst;
}

// Synkronisér AI-tab med aldersgruppe-tab når bruger klikker
function skiftGruppeOgAI(id) {
  aktivGruppe = id;
  aktivAiTab  = id;
  localStorage.setItem('hv_prognose_gruppe', id);
  byggTabs();
  opdaterKPI();
  render();
  if (analyseData) {
    const g = ALLE_GRUPPER.find(x => x.id === id);
    opdaterOverskrift(id);
    document.querySelectorAll('.ai-tab').forEach(t => {
      const grp = ALLE_GRUPPER.find(x => x.label === t.textContent);
      t.classList.toggle('active', grp?.id === id);
    });
    visAnalyseTekst();
  }
}

/* ═══════════════════════════════════════════════════
   DYNAMISK OVERSKRIFT
═══════════════════════════════════════════════════ */
function genererOverskrift(gruppeId) {
  if (analyseData?.overskrift?.[gruppeId]) return analyseData.overskrift[gruppeId];

  const senesteTidRaw = document.getElementById('k1d').textContent || '';
  const periode = senesteTidRaw;
  const faktisk = document.getElementById('k1').textContent  || '—';
  const afvEl   = document.getElementById('k3').textContent  || '';
  const afvNum  = parseInt(afvEl.replace(/\./g,'').replace('+','')) || 0;
  const g       = ALLE_GRUPPER.find(x => x.id === gruppeId) || ALLE_GRUPPER[0];

  if (gruppeId === 'alle') {
    if (!periode || faktisk === '—') return 'Befolkningsudviklingen i Hvidovre';
    const afvTekst = afvNum === 0 ? 'præcis på prognosen'
                   : afvNum >  0 ? `${afvEl} over prognosen`
                   :               `${Math.abs(afvNum).toLocaleString('da-DK')} under prognosen`;
    return `${faktisk} hvidovreaner i ${periode} — ${afvTekst}`;
  }
  if (!periode || faktisk === '—') return `${g.label} — befolkningsudvikling`;
  return `${g.label}: ${faktisk} borgere i ${periode}`;
}

function opdaterOverskrift(id) {
  document.getElementById('aiHeading').textContent = genererOverskrift(id);
}

function downloadRapport() {
  const blob = new Blob([document.documentElement.outerHTML], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'hvidovre-folkepuls.html'; a.click();
}

/* ═══════════════════════════════════════════════════
   STARTUP
═══════════════════════════════════════════════════ */
window.addEventListener('load', () => {
  if (window.location.protocol === 'file:') {
    document.getElementById('statusMsg').textContent = 'Åbn rapporten på GitHub Pages for at se live data (CORS-begrænsning ved lokal åbning)';
  }
  document.getElementById('btnGraf').classList.toggle('active', display==='graf');
  document.getElementById('btnTabel').classList.toggle('active', display==='tabel');
  byggTabs();
  // Hent DST-data og AI-analyse parallelt
  loadData();
  loadAnalyse();
});
</script>
