<!DOCTYPE html>
<html lang="da">
<head>
<script>
(function(){if(window.self===window.top)return;
var n=document.querySelector('.ap-navbar');
if(n){n.style.setProperty('display','none','important');
n.style.setProperty('height','0','important');
n.style.setProperty('overflow','hidden','important');}
})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hvidovre Folkepuls — Befolkningsmonitor 2026</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap');

  :root {
    --green:     #1A4D2E;
    --green-mid: #2E7D54;
    --gold:      #C9973A;
    --red:       #C0392B;
    --bg:    #F9F6F0;
    --card:  #FFFFFF;
    --text:  #1C1C1A;
    --mid:   #4A4A44;
    --muted: #8A8A7E;
    --border:#E2DDD4;
    --shadow:0 2px 20px rgba(26,77,46,0.07);
    --g0:  #5DADE2; /* 0-2 */
    --g1:  #48C9B0; /* 3-5 */
    --g2:  #2E7D54; /* 6-17 */
    --g3:  #1A4D2E; /* 18-24 */
    --g4:  #C9973A; /* 25-66 */
    --g5:  #C0392B; /* 67-79 */
    --g6:  #8E44AD; /* 80+ */
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }

  /* HEADER */
  .hdr {
    background:var(--green); color:#fff;
    padding:32px 48px 26px; position:relative; overflow:hidden;
  }
  .hdr::before {
    content:''; position:absolute; right:-60px; bottom:-60px;
    width:280px; height:280px; border-radius:50%;
    background:rgba(255,255,255,.03); pointer-events:none;
  }
  .hdr-eye { font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:10px; }
  .hdr h1  { font-family:'DM Serif Display',serif; font-size:clamp(20px,2.5vw,30px); font-weight:400; line-height:1.2; margin-bottom:8px; }
  .hdr h1 em { font-style:italic; color:#E8C06A; }
  .hdr p   { font-size:13px; color:rgba(255,255,255,.6); font-weight:300; line-height:1.65; max-width:600px; }

  /* TOOLBAR */
  .toolbar {
    background:#fff; border-bottom:1px solid var(--border);
    padding:10px 48px; display:flex; align-items:center;
    gap:10px; flex-wrap:wrap;
  }
  .btn {
    padding:7px 15px; border:1.5px solid var(--border); background:transparent;
    font-family:'DM Sans',sans-serif; font-size:13px; color:var(--mid);
    cursor:pointer; border-radius:6px; transition:all .15s; white-space:nowrap;
  }
  .btn:hover  { border-color:var(--green); color:var(--green); }
  .btn.grn    { background:var(--green); border-color:var(--green); color:#fff; }
  .btn.grn:hover { background:#143d24; }
  .btn.gld    { background:var(--gold); border-color:var(--gold); color:#fff; }
  .btn.gld:hover { background:var(--green); border-color:var(--green); }
  #updateTime { font-family:'DM Mono',monospace; font-size:10.5px; color:var(--muted); margin-left:auto; }

  /* STATUS */
  .statusbar {
    background:#fff; border-bottom:1px solid var(--border);
    padding:8px 48px; display:flex; align-items:center; gap:9px; min-height:34px;
  }
  .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot.loading { background:var(--gold); animation:pulse .9s ease-in-out infinite; }
  .dot.ok      { background:var(--green-mid); }
  .dot.error   { background:var(--red); }
  #statusMsg   { font-family:'DM Mono',monospace; font-size:11px; color:var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* MAIN */
  main { padding:26px 48px; max-width:1140px; }

  /* KPI */
  .kpi-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:11px; margin-bottom:24px; }
  .kpi {
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--green);
    border-radius:10px; padding:14px 17px; box-shadow:var(--shadow); transition:opacity .3s;
  }
  .kpi.gld { border-left-color:var(--gold); }
  .kpi.red { border-left-color:var(--red);  }
  .kpi.mid { border-left-color:var(--green-mid); }
  .kpi.dim { opacity:.35; }
  .kpi-lbl  { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:5px; }
  .kpi-val  { font-family:'DM Serif Display',serif; font-size:30px; line-height:1; color:var(--text); margin-bottom:3px; }
  .kpi-desc { font-size:11.5px; color:var(--mid); line-height:1.4; }

  /* AGE GROUP TABS */
  .tab-scroll { overflow-x:auto; margin-bottom:16px; padding-bottom:2px; }
  .tab-row { display:flex; gap:5px; min-width:max-content; }
  .atab {
    padding:7px 14px; border:1.5px solid var(--border); background:#fff;
    font-family:'DM Sans',sans-serif; font-size:12.5px; color:var(--mid);
    cursor:pointer; border-radius:7px; transition:all .15s; white-space:nowrap;
    font-weight:400;
  }
  .atab:hover { border-color:var(--green); color:var(--green); }
  .atab.active { color:#fff; border-color:transparent; font-weight:500; }
  .atab.alle-tab { font-weight:600; }

  /* CHART CARD */
  .chart-card { display:none; } /* ikke længere i brug */

  /* DISPLAY TOGGLE */
  .display-toggle { display:flex; border:1.5px solid var(--border); border-radius:7px; overflow:hidden; flex-shrink:0; }
  .dtab {
    padding:6px 14px; border:none; background:transparent;
    font-family:'DM Sans',sans-serif; font-size:12px; color:var(--mid);
    cursor:pointer; transition:all .15s; white-space:nowrap; border-right:1px solid var(--border);
  }
  .dtab:last-child { border-right:none; }
  .dtab:hover  { background:#F0F0EA; color:var(--green); }
  .dtab.active { background:var(--green); color:#fff; }

  /* LEGEND */
  .legend { display:flex; gap:14px; margin:10px 0 8px; flex-wrap:wrap; }
  .leg {
    display:flex; align-items:center; gap:7px; font-size:12px; color:var(--mid);
    cursor:pointer; user-select:none; padding:3px 8px 3px 4px;
    border-radius:5px; transition:opacity .15s, background .15s;
  }
  .leg:hover { background:#F0F0EA; }
  .leg.skjult { opacity:.3; }
  .leg-ln { width:24px; height:3px; border-radius:2px; flex-shrink:0; }

  /* CHART */
  .chart-wrap { position:relative; height:360px; }
  .ov {
    display:none; position:absolute; inset:0; background:rgba(255,255,255,.88);
    border-radius:10px; align-items:center; justify-content:center;
    flex-direction:column; gap:11px; z-index:10;
    font-family:'DM Mono',monospace; font-size:12px; color:var(--muted);
  }
  .ov.show { display:flex; }
  .spin { width:24px; height:24px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* TABLE */
  .tbl-wrap { display:none; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead tr { background:var(--green); color:#fff; }
  thead th { padding:10px 14px; text-align:left; font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; }
  tbody tr:nth-child(even) { background:#F6F3ED; }
  tbody tr:hover { background:#EBF4EF; }
  tbody td { padding:9px 14px; border-bottom:1px solid var(--border); color:var(--mid); }
  tbody td:first-child { font-family:'DM Mono',monospace; font-size:12px; color:var(--text); font-weight:500; }
  .pos { color:var(--green-mid) !important; font-weight:700; }
  .neg { color:var(--red) !important; font-weight:700; }
  .hi  { font-weight:700; color:var(--text) !important; }

  /* NOTE + SOURCE */
  .note { background:#FDF9F0; border:1px solid #EDD9A0; border-radius:8px; padding:10px 14px; font-size:12px; color:#7A6020; line-height:1.55; margin-top:12px; }
  .note strong { color:#5A4010; }
  .source { margin-top:22px; padding:11px 14px; background:#fff; border:1px solid var(--border); border-radius:8px; font-family:'DM Mono',monospace; font-size:10px; color:var(--muted); line-height:1.7; }
  .source strong { color:var(--mid); }

  /* ── MAIN CARD (samlet analyse + graf) ── */
  .main-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; box-shadow:var(--shadow);
    overflow:hidden; margin-bottom:16px;
  }

  /* ── AI ANALYSE SEKTION ── */
  .ai-section {
    padding:28px 32px 24px;
    background:linear-gradient(160deg, #F2F8F5 0%, #FDFBF7 60%, #FFFFFF 100%);
  }
  .ai-section-top {
    display:flex; align-items:flex-start;
    justify-content:space-between; gap:20px;
    margin-bottom:18px; flex-wrap:wrap;
  }
  .ai-section-left { flex:1; min-width:0; }

  .ai-eyebrow {
    display:flex; align-items:center; gap:7px;
    font-family:'DM Mono',monospace; font-size:10.5px;
    letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted); margin-bottom:10px;
  }
  .ai-spark {
    width:20px; height:20px; border-radius:5px;
    background:linear-gradient(135deg, var(--gold), #E8C06A);
    display:flex; align-items:center; justify-content:center;
    font-size:10px; color:#fff; flex-shrink:0;
  }
  .ai-badge {
    font-family:'DM Mono',monospace; font-size:10px;
    padding:2px 8px; border-radius:20px; display:none;
  }
  .ai-badge.ny     { display:inline-block; background:#EDF7F0; color:var(--green); border:1px solid #B8DFC8; }
  .ai-badge.gammel { display:inline-block; background:#FEF9EE; color:var(--gold);  border:1px solid #F0D9A0; }

  .ai-heading {
    font-family:'DM Serif Display',serif;
    font-size:clamp(18px,2.2vw,24px); font-weight:400;
    color:var(--text); margin-bottom:5px; line-height:1.2;
  }
  .ai-period { font-size:11.5px; color:var(--muted); font-family:'DM Mono',monospace; }



  .ai-body { font-size:14px; color:var(--mid); line-height:1.85; font-weight:300; }
  .ai-text { white-space:pre-wrap; }
  .ai-empty { color:var(--muted); font-size:13px; font-style:italic; }
  .ai-loading { display:flex; align-items:center; gap:9px; color:var(--muted); font-family:'DM Mono',monospace; font-size:12px; }

  /* ── SKILLELINJE ── */
  .card-divider { height:1px; background:var(--border); }

  /* ── GRAF SEKTION ── */
  .chart-section { padding:18px 32px 24px; }
  .chart-section-top {
    display:flex; align-items:center;
    justify-content:space-between; gap:14px;
    margin-bottom:0; flex-wrap:wrap;
  }
  .chart-sec-label {
    font-family:'DM Mono',monospace; font-size:10.5px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    margin-bottom:2px;
  }
  .chart-sec-desc { font-size:12px; color:var(--muted); line-height:1.5; }

  @media (max-width:700px) {
    .hdr, main, .toolbar, .statusbar { padding-left:16px; padding-right:16px; }
    .chart-wrap { height:260px; }
    .ai-section { padding:20px 18px 18px; }
    .chart-section { padding:16px 18px 20px; }
    .ai-section-top { flex-direction:column; }
  }
</style>
</head>
<body>
<style>
.ap-navbar{all:unset;display:flex!important;align-items:center;gap:0;background:#0E1612;border-bottom:1px solid rgba(255,255,255,0.08);padding:0 28px;height:40px;font-family:'DM Mono',monospace,sans-serif;position:relative;z-index:9999;box-sizing:border-box;width:100%;}
.ap-back{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.55);font-size:11.5px;letter-spacing:0.04em;text-decoration:none;transition:color 0.18s;cursor:pointer;}
.ap-back:hover{color:#E8C06A;}
.ap-back svg{flex-shrink:0;transition:transform 0.18s;}
.ap-back:hover svg{transform:translateX(-3px);}
.ap-brand{font-size:11.5px;letter-spacing:0.08em;color:#E8C06A;margin-left:4px;}
.ap-sep{width:1px;height:18px;background:rgba(255,255,255,0.1);margin:0 16px;}
.ap-domain{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.25);}
.ap-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(201,151,58,0.6);margin-right:8px;vertical-align:middle;}
</style>
<div class="ap-navbar">

  <div class="ap-sep"></div>
</body>
